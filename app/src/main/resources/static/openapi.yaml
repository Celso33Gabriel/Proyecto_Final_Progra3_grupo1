openapi: 3.0.3
info:
  title: API de Estructuras de Datos - Árboles Binarios
  description: API para la gestión de nodos y ejecución de algoritmos académicos sobre árboles (UMG).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor Local de Desarrollo

paths:
  /api/nodes:
    post:
      summary: Insertar un nuevo nodo en el árbol
      operationId: saveNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: "15"
                value:
                  type: string
                  example: "Nodo Quince"
      responses:
        '200':
          description: Nodo insertado y procesado exitosamente en el árbol.
        '400':
          description: Datos de entrada inválidos.

  /api/trees/dfs:
    get:
      summary: Ejecutar recorrido DFS (Profundidad)
      operationId: runDFS
      responses:
        '200':
          description: Recorrido ejecutado. Revisa la consola de Spring para ver la salida secuencial.

  /api/trees/bfs:
    get:
      summary: Ejecutar recorrido BFS (Amplitud)
      operationId: runBFS
      responses:
        '200':
          description: Recorrido ejecutado con éxito en memoria.

  /api/trees/height:
    get:
      summary: Obtener la altura absoluta del árbol
      operationId: getHeight
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  altura:
                    type: integer
                    example: 3

  /api/trees/depth/{valor}:
    get:
      summary: Obtener la profundidad de un nodo específico
      operationId: getDepth
      parameters:
        - name: valor
          in: path
          required: true
          schema:
            type: integer
          example: 10
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  profundidad:
                    type: integer
                    example: 2
        '404':
          description: El nodo especificado no existe en el árbol actual.

  /api/trees/ancestors/{valor}:
    get:
      summary: Mostrar los ancestros de un nodo
      operationId: getAncestors
      parameters:
        - name: valor
          in: path
          required: true
          schema:
            type: integer
          example: 8
      responses:
        '200':
          description: Ancestros impresos en la consola del sistema.

  /api/trees/check-cycles:
    get:
      summary: Verificar si la estructura del árbol contiene ciclos
      operationId: checkCycles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasCycles:
                    type: boolean
                    example: false